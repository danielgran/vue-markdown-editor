name: Publish Vue3 Package to npm

on:
  release:
    types: [published]
  push:
    branches:
      - dev
      - staging
      - main

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # Required for npm provenance

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Unit Tests
        run: npm run test

      - name: Build package
        run: npm run build

      # Map each branch to its npm dist-tag.
      - name: Resolve npm dist-tag for this stage
        id: stage
        run: |
          case "${GITHUB_REF_NAME}" in
            staging) echo "tag=beta"    >> "$GITHUB_OUTPUT" ;;
            dev)     echo "tag=dev"     >> "$GITHUB_OUTPUT" ;;
            *)       echo "tag=latest"  >> "$GITHUB_OUTPUT" ;;
          esac

      # Publish prereleases from dev/staging branches
      - name: Publish staged prerelease (dev/staging branches)
        if: github.ref != 'refs/heads/main' && github.event_name == 'push'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }} # 👈 MUST provide the authentication token
          TAG: ${{ steps.stage.outputs.tag }}
        run: |
          SHORT_SHA=$(echo "$GITHUB_SHA" | cut -c1-7)
          BASE_VERSION=$(node -p "require('./package.json').version")
          PRERELEASE_VERSION="${BASE_VERSION}-${TAG}.${SHORT_SHA}"
          echo "Publishing staged prerelease ${PRERELEASE_VERSION} under dist-tag '${TAG}'"
          
          # Modifying version on the fly works with Trusted Publishers, 
          # but if using standard tokens, it must match the git state.
          npm version "${PRERELEASE_VERSION}" --no-git-tag-version
          npm publish --provenance --access public --tag "${TAG}"

      # main branch pushes and published GitHub Releases become the stable line.
      - name: Publish stable (main push or GitHub release)
        if: github.ref == 'refs/heads/main' || github.event_name == 'release'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }} # 👈 MUST provide the authentication token
        # Added missing '--access public' flag below to prevent 404 on scoped packages
        run: npm publish --provenance --access public
